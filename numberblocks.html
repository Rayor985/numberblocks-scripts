const EPISODES = [{"s": 1, "n": 1, "en": "One", "cn": "一号之歌", "desc": "一号蹦蹦跳跳登场，带大家认识数字 1！", "url": "series-1/01-one.html", "thumb": "assets/img/s01e01-hero.jpg"}, {"s": 1, "n": 2, "en": "Another One", "cn": "再来一个一号", "desc": "一号照到一面魔镜，遇到了另一个一号——一加一等于二！", "url": "series-1/02-another-one.html", "thumb": "assets/img/s01e02-hero.jpg"}, {"s": 1, "n": 3, "en": "Two", "cn": "二号之歌", "desc": "二号登场！她最爱成双成对：两只鞋、两只眼睛！", "url": "series-1/03-two.html", "thumb": "assets/img/s01e03-hero.jpg"}, {"s": 1, "n": 4, "en": "Three", "cn": "三号之歌", "desc": "三号登场！她是杂耍高手：三个球，一、二、三！", "url": "series-1/04-three.html", "thumb": "assets/img/s01e04-hero.jpg"}, {"s": 1, "n": 5, "en": "One, Two, Three!", "cn": "一、二、三！", "desc": "三号变魔术数苹果：一、二、三，还要排排队比大小！", "url": "series-1/05-one-two-three.html", "thumb": "assets/img/s01e05-hero.jpg"}, {"s": 1, "n": 6, "en": "Four", "cn": "四号之歌", "desc": "四号登场！他是方方正正的正方形：四条边、四个角！", "url": "series-1/06-four.html", "thumb": "assets/img/s01e06-hero.jpg"}, {"s": 1, "n": 7, "en": "Five", "cn": "五号之歌", "desc": "五号登场！她最爱击掌：一、二、三、四、五！", "url": "series-1/07-five.html", "thumb": "assets/img/s01e07-hero.jpg"}, {"s": 1, "n": 8, "en": "Three Little Pigs", "cn": "三只小猪", "desc": "三只小猪盖房子，大坏正方形来了！大家一起数到四！", "url": "series-1/08-three-little-pigs.html", "thumb": "assets/img/s01e08-hero.jpg"}, {"s": 1, "n": 9, "en": "Off We Go", "cn": "出发啦", "desc": "五号带着朋友们去田野森林大冒险：排好队，一、二、三、四、五！", "url": "series-1/09-off-we-go.html", "thumb": "assets/img/s01e09-hero.jpg"}, {"s": 1, "n": 10, "en": "How to Count", "cn": "怎么数数", "desc": "野餐时少了一块煎饼！是煎饼小偷干的。数一数：一个一个点，最后一个数就是总数！", "url": "series-1/10-how-to-count.html", "thumb": "assets/img/s01e10-hero.jpg"}, {"s": 1, "n": 11, "en": "Stampolines", "cn": "印章蹦床", "desc": "三号开了印章蹦床乐园！同样的数量，可以摆出不同的图案！", "url": "series-1/11-stampolines.html", "thumb": "assets/img/s01e11-hero.jpg"}, {"s": 1, "n": 12, "en": "The Whole of Me", "cn": "完整的我", "desc": "数字们唱歌跳舞：整体可以分成部分，部分合起来就是整体！", "url": "series-1/12-the-whole-of-me.html", "thumb": "assets/img/s01e12-hero.jpg"}, {"s": 1, "n": 13, "en": "The Terrible Twos", "cn": "捣蛋的二们", "desc": "四号分成两个二号，两个捣蛋的二号到处闯祸！原来数字可以分成几份！", "url": "series-1/13-the-terrible-twos.html", "thumb": "assets/img/s01e13-hero.jpg"}, {"s": 1, "n": 14, "en": "Holes", "cn": "洞洞", "desc": "数字乐园出现了好多洞！掉进去减一，爬出来加一！", "url": "series-1/14-holes.html", "thumb": "assets/img/s01e14-hero.jpg"}, {"s": 1, "n": 15, "en": "Hide and Seek", "cn": "捉迷藏", "desc": "大家玩捉迷藏！五号一眼认出藏起来的朋友：三加二就是五！", "url": "series-1/15-hide-and-seek.html", "thumb": "assets/img/s01e15-hero.jpg"}, {"s": 2, "n": 1, "en": "Six", "cn": "六号", "desc": "Numberblocks 们交到了新朋友六号，她最爱掷骰子——有六号在，什么都变成游戏！", "url": "series-2/01-six.html"}, {"s": 2, "n": 2, "en": "Seven", "cn": "七号", "desc": "野餐遇上雨天，可当幸运的七号出现，一切都变得彩虹般美好！", "url": "series-2/02-seven.html"}, {"s": 2, "n": 3, "en": "Eight", "cn": "八号", "desc": "数字乐园迎来超级英雄八号——朋友们都叫他 Octoblock！", "url": "series-2/03-eight.html"}, {"s": 2, "n": 4, "en": "Nine", "cn": "九号", "desc": "九号来到数字乐园，和四号成了朋友，唱起正方形的歌——还打了个大喷嚏！", "url": "series-2/04-nine.html"}, {"s": 2, "n": 5, "en": "Ten", "cn": "十号", "desc": "十号登场，告诉大家做一个\"完美十\"是什么感觉！", "url": "series-2/05-ten.html"}, {"s": 2, "n": 6, "en": "Just Add One", "cn": "加一就行", "desc": "一号最爱唱歌、跳舞、交朋友——只要加上一号，就能从一数到十！", "url": "series-2/06-just-add-one.html"}, {"s": 2, "n": 7, "en": "Blast Off", "cn": "发射", "desc": "十号答应带大家去月球，却自己先飞走了！大家想办法：怎样才能追上她？", "url": "series-2/07-blast-off.html"}, {"s": 2, "n": 8, "en": "Counting Sheep", "cn": "数绵羊", "desc": "六号想哄调皮的小羊睡觉，却发现：两个头（或三个头）比一个头强——把六分成相等的几份！", "url": "series-2/08-counting-sheep.html"}, {"s": 2, "n": 9, "en": "Double Trouble", "cn": "翻倍麻烦", "desc": "一号发现了一张藏宝图，独自勇闯\"翻倍地牢\"，寻找传说中的金苹果。每穿过一扇翻倍门，她就翻一倍：1→2→4→8，直达 Octoblock！可出来的时候，又该怎么办呢？", "url": "series-2/09-double-trouble.html"}, {"s": 2, "n": 10, "en": "The Three Threes", "cn": "三个三", "desc": "九号需要帮手，摇身一变成马戏团明星\"三个三\"！把九分成相等的三份！", "url": "series-2/10-the-three-threes.html"}, {"s": 2, "n": 11, "en": "Odds and Evens", "cn": "奇数 vs 偶数", "desc": "Numberblocks 们来了一场弹跳球大赛：偶数队\"Even Tops\"对战奇数队\"Odd Blocks\"！", "url": "series-2/11-odds-and-evens.html"}, {"s": 2, "n": 12, "en": "Fluffies", "cn": "毛球", "desc": "一号发现了一只毛茸茸的小毛球，挠得二号直痒痒——很快数字乐园到处都是毛球了！", "url": "series-2/12-fluffies.html"}, {"s": 2, "n": 13, "en": "The Two Tree", "cn": "双数树", "desc": "Numberblocks 们发现了一棵神奇的\"双数树\"：每次摇一摇，就减掉二！", "url": "series-2/13-the-two-tree.html"}, {"s": 2, "n": 14, "en": "Numberblock Castle", "cn": "数字城堡", "desc": "一号、二号、三号、四号去城堡探险，一路交朋友、变大变大再变大！", "url": "series-2/14-numberblock-castle.html"}, {"s": 2, "n": 15, "en": "Ten Green Bottles", "cn": "十个绿瓶子", "desc": "墙上有十个绿瓶子，一个不小心掉了下来……从十数到一！", "url": "series-2/15-ten-green-bottles.html"}, {"s": 3, "n": 1, "en": "Once Upon a Time", "cn": "从前从前", "desc": "睡前故事时间到！听故事，复习数字 1 到 5。", "url": "series-3/01-once-upon-a-time.html"}, {"s": 3, "n": 2, "en": "Blockzilla", "cn": "大怪兽", "desc": "大怪兽 Blockzilla 只吃更大的数字！谁大谁小，比一比就知道。", "url": "series-3/02-blockzilla.html"}, {"s": 3, "n": 3, "en": "The Numberblocks Express", "cn": "数字快车", "desc": "数字快车出发啦！乘客上上下下，看看 5 有多少种分法。", "url": "series-3/03-the-numberblocks-express.html"}, {"s": 3, "n": 4, "en": "Fruit Salad", "cn": "水果沙拉", "desc": "做水果沙拉啦！把水果分成两份，数字分合看得见。", "url": "series-3/04-fruit-salad.html"}, {"s": 3, "n": 5, "en": "Zero", "cn": "零号", "desc": "零号登场！\"没有\"也是一个数字哦。", "url": "series-3/05-zero.html"}, {"s": 3, "n": 6, "en": "Now We Are Six to Ten", "cn": "六到十集合", "desc": "六号到十号集合！每个数字都有自己的绝招。", "url": "series-3/06-now-we-are-six-to-ten.html"}, {"s": 3, "n": 7, "en": "Numberblobs", "cn": "小 Blob 大集合", "desc": "认识小 Blob 们！数一数有几只，看它们变成数字。", "url": "series-3/07-numberblobs.html"}, {"s": 3, "n": 8, "en": "Building Blocks", "cn": "积木变变变", "desc": "外星人来访！6 到 10 摆出各种形状——形状变了，数字不变。", "url": "series-3/08-building-blocks.html"}, {"s": 3, "n": 9, "en": "Peekaboo!", "cn": "躲猫猫", "desc": "躲猫猫啦！谁大谁小，一眼就看出来。", "url": "series-3/09-peekaboo.html"}, {"s": 3, "n": 10, "en": "Hiccups", "cn": "打嗝", "desc": "哎哟打嗝了！每打一个嗝，6 到 10 就散开一次。", "url": "series-3/10-hiccups.html"}, {"s": 3, "n": 11, "en": "What's the Difference?", "cn": "差多少？", "desc": "比一比，差多少？减法就是找\"不一样\"的那部分。", "url": "series-3/11-whats-the-difference.html"}, {"s": 3, "n": 12, "en": "Numberblock Rally", "cn": "拉力赛", "desc": "数字拉力赛开始！一路加加减减，冲向终点。", "url": "series-3/12-numberblock-rally.html"}, {"s": 3, "n": 13, "en": "Five and Friends", "cn": "五和朋友们", "desc": "五号和朋友们手拉手：5 加 1 到 5，变成 6 到 10！", "url": "series-3/13-five-and-friends.html"}, {"s": 3, "n": 14, "en": "Octoblock to the Rescue!", "cn": "Octoblock 来救援！", "desc": "Octoblock 来救援！8 有好多种分法，每种分法都能帮忙。", "url": "series-3/14-octoblock-to-the-rescue.html"}, {"s": 3, "n": 15, "en": "Ten Again", "cn": "凑成十", "desc": "1 加 9，2 加 8……凑成 10 的方法有好多！", "url": "series-3/15-ten-again.html"}, {"s": 3, "n": 16, "en": "Flatland", "cn": "平面国", "desc": "Numberblocks 们掉进了平面国，一切都变扁了！认识三角形、正方形、长方形和圆形。", "url": "series-3/16-flatland.html"}, {"s": 3, "n": 17, "en": "Pattern Palace", "cn": "图案宫殿", "desc": "图案宫殿的大门上藏着规律：红、蓝、红、蓝……接下来是什么？", "url": "series-3/17-pattern-palace.html"}, {"s": 3, "n": 18, "en": "The Legend of Big Tum", "cn": "大块头 Big Tum 的传说", "desc": "地上有巨大的脚印，每个脚印都是一道缺数字的加法题！解开它们，就能找到传说中的大块头 Big Tum。", "url": "series-3/18-the-legend-of-big-tum.html"}, {"s": 3, "n": 19, "en": "Mirror, Mirror", "cn": "魔镜魔镜", "desc": "神奇的魔镜告诉你：乘法就是\"几个几\"！三个二是多少？", "url": "series-3/19-mirror-mirror.html"}, {"s": 3, "n": 20, "en": "The Wrong Number", "cn": "猜猜数字", "desc": "猜数字游戏：偶数、比 3 大、比 5 小——到底是几号？", "url": "series-3/20-the-wrong-number.html"}, {"s": 3, "n": 21, "en": "Eleven", "cn": "十一号", "desc": "十号加一号，组成全新的十一号！11 = 10 + 1。", "url": "series-3/21-eleven.html"}, {"s": 3, "n": 22, "en": "Twelve", "cn": "十二号", "desc": "十号加二号，十二号登场！分法最多的数字：6+6、4+4+4、3+3+3+3！", "url": "series-3/22-twelve.html"}, {"s": 3, "n": 23, "en": "The Way of the Rectangle", "cn": "长方形之道", "desc": "把方块摆成长方形，就能看出它的因数！六号是长方形大师。", "url": "series-3/23-the-way-of-the-rectangle.html"}, {"s": 3, "n": 24, "en": "Ride the Rays", "cn": "光束之旅", "desc": "乘上光束之前，先分成相等的几组！一个不剩，就是整除，一路顺风！", "url": "series-3/24-ride-the-rays.html"}, {"s": 3, "n": 25, 各有一把数字锁，用「五加一点点」的办法就能双倍打开。", "url": "series-8/12-double-doors-double-locked.html"}, {"s": 8, "n": 13, "en": "The All-Knowing Nine", "cn": "全知的九", "desc": "九号要用凑十法快速算出答案，知道怎么凑满十，加法就快得多。", "url": "series-8/13-the-all-knowing-nine.html"}, {"s": 8, "n": 14, "en": "Subtraction Somersaults", "cn": "减法翻筋斗", "desc": "减法也能越过十：先减到十，再把剩下的减掉，翻个筋斗答案就出来了。", "url": "series-8/14-subtraction-somersaults.html"}, {"s": 8, "n": 15, "en": "Tenpin Tournament", "cn": "保龄球大赛", "desc": "十号用算珠架一次掷倒两个个位数球瓶，再用正字法记下分数。", "url": "series-8/15-tenpin-tournament.html"}, {"s": 8, "n": 16, "en": "Five's Super Sorter", "cn": "五号超级分类机", "desc": "五号的分类机要把东西按类别归堆，Sorty 帮忙把每一样放进对的格子。", "url": "series-8/16-fives-super-sorter.html"}, {"s": 8, "n": 17, "en": "Back in the Box!", "cn": "回到盒子里！", "desc": "散落的积木要靠正字记号清点，一笔一笔记下来，数量就不会错。", "url": "series-8/17-back-in-the-box.html"}, {"s": 8, "n": 18, "en": "Five's Fruit Festival", "cn": "五号水果节", "desc": "水果节用象形图摆出最受欢迎的水果，一眼就能比出多少。", "url": "series-8/18-fives-fruit-festival.html"}, {"s": 8, "n": 19, "en": "I'll Vote for That!", "cn": "我投这一票！", "desc": "大家投票决定活动方案，数一数票数、看懂条形图，公平的选择就出来了。", "url": "series-8/19-ill-vote-for-that.html"}, {"s": 8, "n": 20, "en": "The Pyramid of Puzzles", "cn": "谜题金字塔", "desc": "谜题金字塔按条形图的高度从低到高排列，只有把图形对上才能登顶。", "url": "series-8/20-the-pyramid-of-puzzles.html"}, {"s": 8, "n": 21, "en": "One's Fix-It Shop", "cn": "一号修理铺", "desc": "一号修理铺把两块碎片拼回一个整体，缺多少就补多少。", "url": "series-8/21-ones-fix-it-shop.html"}, {"s": 8, "n": 22, "en": "Happy Campers", "cn": "快乐露营队", "desc": "露营队把食物平均分给每个人，分得一样多，大家就都开心。", "url": "series-8/22-happy-campers.html"}, {"s": 8, "n": 23, "en": "The Mystery of Fraction Island", "cn": "分数岛之谜", "desc": "岛上的宝箱要用几块相等的部分拼成一个完整的整体才能打开。", "url": "series-8/23-the-mystery-of-fraction-island.html"}, {"s": 8, "n": 24, "en": "Fractions Are a Piece of Cake", "cn": "分数小菜一碟", "desc": "一块蛋糕切成相等的几份，边唱边写出分数的写法。", "url": "series-8/24-fractions-are-a-piece-of-cake.html"}, {"s": 8, "n": 25, "en": "Octonaughty and the Fractionator", "cn": "八淘气与分数机", "desc": "八淘气的分数机把整数乘以单位分数，有时候结果还是整数。", "url": "series-8/25-octonaughty-and-the-fractionator.html"}, {"s": 8, "n": 26, "en": "You're Five Ones and I'm Five Tens", "cn": "你是五个一，我是五个十", "desc": "五个一和五个十一起唱数位歌，说明个位与十位的加法。", "url": "series-8/26-youre-five-ones-and-im-five-tens.html"}, {"s": 8, "n": 27, "en": "The Forest of Tens", "cn": "十的森林", "desc": "走进十的森林，把不是十的数减去十，看看剩下多少。", "url": "series-8/27-the-forest-of-tens.html"}, {"s": 8, "n": 28, "en": "All the Numbers I Can Be", "cn": "我能变成的所有数", "desc": "一和十把 100 的组成方式全部唱出来：因数、数对，怎么组合都行。", "url": "series-8/28-all-the-numbers-i-can-be.html"}, {"s": 8, "n": 29, "en": "The Rings of Unity", "cn": "同心之环", "desc": "几圈数字环合在一起，按数位层层相加，拼出最大的那个数。", "url": "series-8/29-the-rings-of-unity.html"}, {"s": 8, "n": 30, "en": "The Space Signal", "cn": "太空信号", "desc": "大家把因数复习一遍，向太空发出信号，连无穷大也收到了回音。", "url": "series-8/30-the-space-signal.html"}, {"s": 9, "n": 1, "en": "The Day the Blocks Turned Pink", "cn": "方块变粉的那一天", "desc": "一觉醒来，所有方块都变成了粉色，一号和三号要弄清楚发生了什么。", "url": "series-9/01-the-day-the-blocks-turned-pink.html"}, {"s": 9, "n": 2, "en": "An Even Split", "cn": "均匀分割", "desc": "无穷大要把一堆方块平分成两份，只有偶数才分得一样多。", "url": "series-9/02-an-even-split.html"}, {"s": 9, "n": 3, "en": "Trying Times", "cn": "艰难时刻", "desc": "乘法表接连出错，大伙儿一路试到天黑，把难记的倍数重新练熟。", "url": "series-9/03-trying-times.html"}, {"s": 9, "n": 4, "en": "The Rectangular Wreck", "cn": "长方形残骸", "desc": "太空里漂着一块 41 格的残骸，却排不出漂亮长方形——因为 41 是质数。", "url": "series-9/04-the-rectangular-wreck.html"}, {"s": 9, "n": 5, "en": "Everybody Counts", "cn": "人人都来数", "desc": "从一数到五十的大合唱，每个数字都来报到，无穷大在最后加上一个大大的拥抱。", "url": "series-9/05-everybody-counts.html"}];
const SERIES = {"1": {"cn": "第一季", "year": "2017", "color": "#e53935"}, "2": {"cn": "第二季", "year": "2017", "color": "#fb8c00"}, "3": {"cn": "第三季", "year": "2018–2019", "color": "#d4a017"}, "4": {"cn": "第四季", "year": "2019", "color": "#43a047"}, "5": {"cn": "第五季", "year": "2021", "color": "#1e88e5"}, "6": {"cn": "第六季", "year": "2024", "color": "#8e24aa"}, "7": {"cn": "第七季", "year": "2024", "color": "#00acc1"}, "8": {"cn": "第八季", "year": "2025", "color": "#ef6c00"}, "9": {"cn": "第九季", "year": "2025", "color": "#5e35b1"}};

const nav = document.getElementById('nav');
const catalog = document.getElementById('catalog');
const resultsBox = document.getElementById('results');
const rgrid = document.getElementById('rgrid');
const rcount = document.getElementById('rcount');
const q = document.getElementById('q');

function cardHTML(e){
  const color = SERIES[e.s].color;
  let tags = '';
  if(e.musical) tags += '<span class="tag">🎵 音乐集</span>';
  if(e.full) tags += '<span class="tag full">完整版</span>';
  return `<a class="card" href="${e.url}" target="_blank" rel="noopener">
    <div class="num" style="background:${color}">${e.n}</div>
    <div class="info"><div class="en">${e.en}</div><div class="cn">${e.cn}</div>
    ${tags?`<div class="tags">${tags}</div>`:''}</div>
    ${e.thumb?`<div class="thumb"><img src="${e.thumb}" alt="" loading="lazy"></div>`:''}</a>`;
}

function buildNav(){
  let h = '';
  for(const s of Object.keys(SERIES)){
    const c = SERIES[s], n = EPISODES.filter(e=>e.s==s).length;
    h += `<a href="#s${s}"><span class="dot" style="background:${c.color}"></span>${c.cn} · ${n}集</a>`;
  }
  nav.innerHTML = h;
}

function buildCatalog(){
  let h = '';
  for(const s of Object.keys(SERIES)){
    const c = SERIES[s];
    const eps = EPISODES.filter(e=>e.s==s);
    h += `<section class="series" id="s${s}">
      <div class="series-head" style="border-color:${c.color}">
        <h2>${c.cn}</h2><span class="meta">Series ${s} · ${c.year} · ${eps.length} 集</span>
      </div><div class="grid">` + eps.map(cardHTML).join('') + `</div></section>`;
  }
  catalog.innerHTML = h;
}

q.addEventListener('input', ()=>{
  const kw = q.value.trim().toLowerCase();
  if(!kw){ resultsBox.style.display='none'; catalog.style.display=''; return; }
  const hits = EPISODES.filter(e =>
    e.en.toLowerCase().includes(kw) || e.cn.includes(q.value.trim()) ||
    String(e.n)===kw || ('s'+e.s)===kw);
  catalog.style.display='none'; resultsBox.style.display='';
  rcount.textContent = `找到 ${hits.length} 集`;
  rgrid.innerHTML = hits.length ? hits.map(cardHTML).join('')
    : `<div class="empty">没有找到相关剧集，换个关键词试试</div>`;
});

buildNav();
buildCatalog();
</script>
</body>
</html>
