<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#sky)"/>
  <!-- 太阳 -->
  <circle cx="340" cy="40" r="25" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
    <line x1="340" y1="5" x2="340" y2="15"/>
    <line x1="340" y1="65" x2="340" y2="75"/>
    <line x1="305" y1="40" x2="315" y2="40"/>
    <line x1="365" y1="40" x2="375" y2="40"/>
    <line x1="315" y1="15" x2="322" y2="22"/>
    <line x1="358" y1="58" x2="365" y2="65"/>
    <line x1="365" y1="15" x2="358" y2="22"/>
    <line x1="322" y1="58" x2="315" y2="65"/>
  </g>
  <!-- 云朵 -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="80" cy="40" rx="30" ry="15"/>
    <ellipse cx="100" cy="35" rx="25" ry="12"/>
    <ellipse cx="60" cy="35" rx="20" ry="10"/>
    <ellipse cx="250" cy="50" rx="28" ry="14"/>
    <ellipse cx="270" cy="45" rx="22" ry="11"/>
  </g>
  <!-- 草地 -->
  <rect x="0" y="140" width="400" height="60" fill="#7CCD7C"/>
  <rect x="0" y="140" width="400" height="10" fill="#6BBF6B"/>
  <!-- 小花 -->
  <g>
    <circle cx="50" cy="160" r="4" fill="#FF6B6B"/>
    <circle cx="50" cy="160" r="2" fill="#FFD700"/>
    <circle cx="120" cy="170" r="4" fill="#FF69B4"/>
    <circle cx="120" cy="170" r="2" fill="#FFD700"/>
    <circle cx="200" cy="165" r="4" fill="#FF6B6B"/>
    <circle cx="200" cy="165" r="2" fill="#FFD700"/>
    <circle cx="300" cy="175" r="4" fill="#FF69B4"/>
    <circle cx="300" cy="175" r="2" fill="#FFD700"/>
    <circle cx="350" cy="160" r="4" fill="#FF6B6B"/>
    <circle cx="350" cy="160" r="2" fill="#FFD700"/>
  </g>
  <!-- 数字方块 1 号 -->
  <g transform="translate(180, 80)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#e53935"/>
    <circle cx="14" cy="16" r="4" fill="#fff"/>
    <circle cx="26" cy="16" r="4" fill="#fff"/>
    <circle cx="15" cy="17" r="2" fill="#23233a"/>
    <circle cx="25" cy="17" r="2" fill="#23233a"/>
    <path d="M 12 26 Q 20 32 28 26" stroke="#23233a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>