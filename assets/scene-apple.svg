<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#E8F5E9"/>
  <!-- 苹果树 -->
  <rect x="90" y="80" width="20" height="80" fill="#8D6E63"/>
  <circle cx="100" cy="60" r="40" fill="#4CAF50"/>
  <circle cx="70" cy="70" r="25" fill="#66BB6A"/>
  <circle cx="130" cy="70" r="25" fill="#66BB6A"/>
  <!-- 苹果 -->
  <circle cx="80" cy="55" r="12" fill="#F44336"/>
  <circle cx="120" cy="50" r="12" fill="#F44336"/>
  <circle cx="100" cy="40" r="12" fill="#F44336"/>
  <circle cx="90" cy="70" r="10" fill="#F44336"/>
  <circle cx="110" cy="70" r="10" fill="#F44336"/>
  <!-- 叶子 -->
  <ellipse cx="100" cy="25" rx="8" ry="4" fill="#4CAF50" transform="rotate(-30 100 25)"/>
  <!-- 草地 -->
  <rect x="0" y="160" width="200" height="40" fill="#7CCD7C"/>
  <!-- 1 号方块 -->
  <g transform="translate(20, 120)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#e53935"/>
    <circle cx="10" cy="12" r="3" fill="#fff"/>
    <circle cx="20" cy="12" r="3" fill="#fff"/>
    <circle cx="11" cy="13" r="1.5" fill="#23233a"/>
    <circle cx="19" cy="13" r="1.5" fill="#23233a"/>
    <path d="M 8 20 Q 15 25 22 20" stroke="#23233a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>