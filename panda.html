const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const IW = 1920, IH = 1280;               // 背景图坐标系
let DPR = 1, view = {s:1, ox:0, oy:0}, par = {x:0, y:0, tx:0, ty:0};
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  view.s = Math.min(innerWidth/IW, innerHeight/IH);
  view.ox = (innerWidth - IW*view.s)/2; view.oy = (innerHeight - IH*view.s)/2;
}
addEventListener('resize', resize); resize();
function toImg(cx, cy){ // 屏幕 -> 图像坐标（含视差）
  return [ (cx - view.ox - par.x*view.s)/view.s, (cy - view.oy - par.y*view.s)/view.s ];
}
function toScr(ix, iy){
  return [ view.ox + (ix + par.x)*view.s, view.oy + (iy + par.y)*view.s ];
}

/* ================= 地形判定（图像坐标） ================= */
const GROUND = [[585,345],[1400,330],[1555,470],[1505,1010],[1330,1085],[520,1085],[385,960],[365,520]];
const GROVE  = [[355,745],[735,630],[800,860],[690,1095],[370,1085]];
const POND = {x:950, y:545, rx:248, ry:110};
const ROCKS = [{x:1278,y:520,r:40}];
function inPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i],[xj,yj]=poly[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function walkable(x,y,pad){
  pad = pad||0;
  if(!inPoly(x,y,GROUND)) return false;
  if(inPoly(x,y,GROVE)) return false;
  const dx=(x-POND.x)/(POND.rx+pad), dy=(y-POND.y)/(POND.ry+pad*0.6);
  if(dx*dx+dy*dy < 1) return false;
  for(const r of ROCKS){ const d=Math.hypot(x-r.x,y-r.y); if(d < r.r+pad) return false; }
  return true;
}
function nearestWalkable(x,y){
  if(walkable(x,y)) return [x,y];
  for(let rad=14; rad<420; rad+=14){
    for(let a=0;a<16;a++){
      const nx=x+Math.cos(a/16*6.283)*rad, ny=y+Math.sin(a/16*6.283)*rad*0.8;
      if(walkable(nx,ny)) return [nx,ny];
    }
  }
  return [960,760];
}

const MAXP = 30;
const pandas = [], particles = [], ripples = [], petals = [];
let selected = null, toastTimer = 0;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1900);
}
let pid = 0;
function makePanda(x, y, h, state){
  const p = { id:++pid, x, y, home:{x, y}, h, state: state||'stand',
    t: 0, dur: 2+Math.random()*2, tx:x, ty:y, dir:1, pop:0, phase: Math.random()*6.28,
    lift:0, blink: 2+Math.random()*3 };
  pandas.push(p); return p;
}
function spawnPanda(x, y, h){
  if(pandas.length >= MAXP){ toast('最多 30 只啦'); return null; }
  const p = makePanda(x, y, h, 'stand');
  burst(x, y - h*0.5, 12);
  return p;
}
function burst(x, y, n){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, sp = 40+Math.random()*90;
    particles.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, life:0.7+Math.random()*0.4, t:0,
      r: 2.4+Math.random()*3, star: Math.random()<0.6});
  }
}
const POSE_H = { stand:1, eat:1, wave:1, walk:1, sleep:0.74 };
function poseImg(p){
  if(p.state==='walk') return IMG.walk;
  if(p.state==='eat') return IMG.eat;
  if(p.state==='sleep') return IMG.sleep;
  if(p.state==='wave') return IMG.wave;
  return IMG.stand;
}
function pandaW(p){ const im = poseImg(p); return p.h * POSE_H[p.state] * (im.width/im.height); }
function pandaH(p){ return p.h * POSE_H[p.state]; }
function chooseNext(p){
  // 小只的喜欢跟着大只的走
  let big = null;
  for(const q of pandas){ if(q!==p && q.h > p.h*1.18){ const d = Math.hypot(q.x-p.x, q.y-p.y); if(d<330 && (!big || d<big.d)) big = {q, d}; } }
  const r = Math.random();
  if(big && r < 0.4){
    const a = Math.random()*6.283, dist = big.q.h*0.75 + 26;
    const nx = big.q.x + Math.cos(a)*dist, ny = big.q.y + Math.sin(a)*dist*0.7;
    if(walkable(nx, ny, 10)){ p.tx = nx; p.ty = ny; p.state='walk'; return; }
  }
  if(r < 0.52){ // 闲逛
    for(let tries=0; tries<8; tries++){
      const a = Math.random()*6.283, dist = 40+Math.random()*130;
      const nx = p.home.x + Math.cos(a)*dist, ny = p.home.y + Math.sin(a)*dist*0.72;
      if(walkable(nx, ny, 10)){ p.tx = nx; p.ty = ny; p.state='walk'; return; }
    }
    p.state='stand'; p.dur = 1.6+Math.random()*1.6;
  } else if(r < 0.72){ p.state='eat';  p.dur = 3.5+Math.random()*3; }
  else if(r < 0.84){ p.state='wave'; p.dur = 2.2+Math.random()*1.4; }
  else if(r < 0.95){ p.state='sleep'; p.dur = 5+Math.random()*4; }
  else { p.state='stand'; p.dur = 2+Math.random()*2; }
  p.t = 0;
}
function updatePanda(p, dt){
  p.t += dt; p.pop = Math.min(1, p.pop + dt/0.45);
  p.blink -= dt; if(p.blink < -0.12) p.blink = 2.2+Math.random()*3.2;
  if(drag.panda === p) return;
  if(p.state === 'walk'){
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    const sp = (26 + p.h*0.16) * dt;
    if(d < 6){ p.state='stand'; p.t=0; p.dur = 1.4+Math.random()*2; }
    else{
      p.dir = dx >= 0 ? 1 : -1;
      let nx = p.x + dx/d*sp, ny = p.y + dy/d*sp;
      // 彼此让路
      for(const q of pandas){ if(q===p) continue;
        const ox = nx-q.x, oy = ny-q.y, od = Math.hypot(ox,oy), min = (p.h+q.h)*0.30;
        if(od>0.01 && od<min){ nx += ox/od*(min-od)*0.6; ny += oy/od*(min-od)*0.6; } }
      if(walkable(nx, ny, 6)){ p.x = nx; p.y = ny; } else { p.state='stand'; p.t=0; p.dur=1.2; }
    }
  } else if(p.t > p.dur){ chooseNext(p); }
}

const TREES = [[452,300],[742,332]];
function spawnPetal(){
  const t = TREES[Math.random()<0.6?0:1];
  petals.push({ x: t[0]+(Math.random()-0.5)*120, y: t[1]+Math.random()*30,
    vx: -6-Math.random()*10, vy: 12+Math.random()*10, ph: Math.random()*6.28, r: 4+Math.random()*3.4 });
}
function drawCloud(x, y, s, alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fffdf6';
  for(const [dx,dy,r] of [[0,0,26],[-22,4,18],[22,5,19],[-8,-8,17],[10,-7,15]]){
    ctx.beginPath(); ctx.ellipse(x+dx*s, y+dy*s, r*s, r*0.62*s, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

/* ================= 渲染 ================= */
function easeOutBack(t){ const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); }
function drawPanda(p, now){
  const im = poseImg(p);
  const popS = p.pop<1 ? Math.max(0.05, easeOutBack(p.pop)) : 1;
  const h = pandaH(p) * popS, w = pandaW(p) * popS;
  let bob = 0, rot = 0, squash = 1;
  if(p.state==='walk' && drag.panda!==p){ bob = Math.abs(Math.sin(now*9 + p.phase))*-h*0.045; rot = Math.sin(now*9+p.phase)*0.03; }
  else { squash = 1 + Math.sin(now*1.7 + p.phase)*0.007; } // 呼吸感
  if(p.blink>0 && p.blink<0.12 && p.state!=='sleep') squash *= 0.965; // 眨眼：极短的轻压
  const lift = (drag.panda===p && drag.moved) ? 34 : 0;
  const [sx, sy] = toScr(p.x, p.y);
  // 影子
  ctx.save();
  ctx.fillStyle = 'rgba(58,66,30,0.20)';
  ctx.beginPath(); ctx.ellipse(sx, sy, w*0.36*view.s, w*0.10*view.s, 0, 0, 6.283); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx, sy - lift*view.s + bob*view.s);
  ctx.rotate(rot);
  ctx.scale(view.s * (p.dir<0 && p.state==='walk' ? -1 : 1), view.s * squash);
  if(selected===p){ // 选中圈
    ctx.strokeStyle = 'rgba(255,176,32,0.9)'; ctx.lineWidth = 3/view.s; ctx.setLineDash([10,7]);
    ctx.beginPath(); ctx.ellipse(0, 0, w*0.52, w*0.14, 0, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.drawImage(im, -w/2, -h, w, h);
  ctx.restore();
  if(p.state==='sleep' && drag.panda!==p){ // Zzz
    ctx.save(); ctx.fillStyle = '#7d97bd'; ctx.textAlign='center';
    for(let i=0;i<2;i++){
      const f = ((now*0.35 + i*0.5 + p.phase) % 1);
      ctx.globalAlpha = 0.85*(1-f);
      ctx.font = `bold ${(13+i*5+f*7)*view.s + 6}px sans-serif`;
      ctx.fillText(i? 'Z':'z', sx + w*0.28*view.s + f*16*view.s, sy - h*view.s - 8*view.s - f*30*view.s);
    }
    ctx.restore();
  }
  if(selected===p){ // 删除小牌
    const bw = 74*view.s, bh = 30*view.s, bx = sx-bw/2, by = sy - (h+52)*view.s;
    p._chip = [bx, by, bw, bh];
    ctx.save();
    ctx.fillStyle = 'rgba(198,74,54,0.95)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `${14*view.s+3}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✕ 删除', sx, by+bh/2+1);
    ctx.restore();
  } else if(p._chip) p._chip = null;
}
let last = 0, rippleTimer = 0, petalTimer = 0;
function frame(ts){
  const now = ts/1000, dt = Math.min(0.05, now - (last||now)); last = now;
  par.x += (par.tx - par.x)*Math.min(1, dt*7); par.y += (par.ty - par.y)*Math.min(1, dt*7);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#f6efdc'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 背景（含视差）
  const [bx, by] = toScr(0,0);
  ctx.drawImage(IMG.bg, bx, by, IW*view.s, IH*view.s);
  // 池塘涟漪
  rippleTimer -= dt;
  if(rippleTimer<=0){ rippleTimer = 1.6+Math.random()*1.6;
    const a = Math.random()*6.283, rr = Math.random()*0.55;
    ripples.push({x: POND.x+Math.cos(a)*POND.rx*rr, y: POND.y+Math.sin(a)*POND.ry*rr, t:0}); }
  for(let i=ripples.length-1;i>=0;i--){ const r = ripples[i]; r.t += dt;
    if(r.t>2.2){ ripples.splice(i,1); continue; }
    const [rx, ry] = toScr(r.x, r.y), rad = (6 + r.t*22)*view.s;
    ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${0.55*(1-r.t/2.2)})`; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(rx, ry, rad, rad*0.42, 0, 0, 6.283); ctx.stroke(); ctx.restore(); }
  // 熊猫（按 y 排序）
  for(const p of pandas) updatePanda(p, dt);
  [...pandas].sort((a,b)=>a.y-b.y).forEach(p=>drawPanda(p, now));
  // 画圈轨迹
  if(pathDraw && pathDraw.length>1){
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3;
    ctx.setLineDash([9,7]); ctx.shadowColor='rgba(90,70,40,.35)'; ctx.shadowBlur=4;
    ctx.beginPath();
    pathDraw.forEach((pt,i)=>{ const [sx,sy]=toScr(pt[0],pt[1]); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.stroke(); ctx.restore();
  }
  // 星星粒子
  for(let i=particles.length-1;i>=0;i--){ const q = particles[i]; q.t += dt;
    if(q.t>q.life){ particles.splice(i,1); continue; }
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 60*dt;
    const [sx, sy] = toScr(q.x, q.y), al = 1 - q.t/q.life;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = '#ffc93c';
    if(q.star){ // 四角星
      const r = q.r*2.2*view.s;
      ctx.beginPath();
      ctx.moveTo(sx, sy-r); ctx.quadraticCurveTo(sx, sy, sx+r, sy); ctx.quadraticCurveTo(sx, sy, sx, sy+r);
      ctx.quadraticCurveTo(sx, sy, sx-r, sy); ctx.quadraticCurveTo(sx, sy, sx, sy-r); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(sx, sy, q.r*view.s, 0, 6.283); ctx.fill(); }
    ctx.restore(); }
  // 樱花瓣
  petalTimer -= dt;
  if(petalTimer<=0){ petalTimer = 0.5+Math.random()*0.7; if(petals.length<26) spawnPetal(); }
  for(let i=petals.length-1;i>=0;i--){ const f = petals[i];
    f.ph += dt*2; f.x += (f.vx + Math.sin(f.ph)*9)*dt; f.y += f.vy*dt;
    if(f.y > 1120){ petals.splice(i,1); continue; }
    const [sx, sy] = toScr(f.x, f.y);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(f.ph*0.7);
    ctx.fillStyle = 'rgba(248,178,205,0.85)';
    ctx.beginPath(); ctx.ellipse(0, 0, f.r*view.s, f.r*0.62*view.s, 0, 0, 6.283); ctx.fill(); ctx.restore(); }
  // 漂浮小云（视差更大）
  const cw = innerWidth;
  drawCloud(cw*0.10 + par.x*1.7*view.s + Math.sin(now*0.05)*8, 86, 1.0, 0.9);
  drawCloud(cw*0.86 + par.x*1.7*view.s + Math.cos(now*0.04)*9, 130, 1.25, 0.95);
  drawCloud(cw*0.62 + par.x*1.7*view.s, 52, 0.7, 0.75);
  requestAnimationFrame(frame);
}

/* ================= 交互 ================= */
let drag = {panda:null, moved:false, dx:0, dy:0};
let pathDraw = null, viewDrag = null;
function hitPanda(ix, iy){
  const sorted = [...pandas].sort((a,b)=>b.y-a.y);
  for(const p of sorted){
    const w = pandaW(p), h = pandaH(p);
    if(Math.abs(ix-p.x) < w*0.5 && iy < p.y+8 && iy > p.y-h-10) return p;
  }
  return null;
}
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  const [ix, iy] = toImg(e.clientX, e.clientY);
  if(selected && selected._chip){
    const [bx,by,bw,bh] = selected._chip;
    if(e.clientX>=bx && e.clientX<=bx+bw && e.clientY>=by && e.clientY<=by+bh){
      burst(selected.x, selected.y-selected.h*0.5, 10);
      pandas.splice(pandas.indexOf(selected),1); selected=null; toast('熊猫回家啦'); return;
    }
  }
  const p = hitPanda(ix, iy);
  if(p){ drag = {panda:p, moved:false, dx:p.x-ix, dy:p.y-iy}; return; }
  if(inPoly(ix, iy, GROUND)){ pathDraw = [[ix,iy]]; selected = null; return; }
  viewDrag = {cx: e.clientX, cy: e.clientY, tx: par.tx, ty: par.ty};
});
cv.addEventListener('pointermove', e=>{
  const [ix, iy] = toImg(e.clientX, e.clientY);
  if(drag.panda){
    if(Math.abs(ix+drag.dx-drag.panda.x) + Math.abs(iy+drag.dy-drag.panda.y) > 4) drag.moved = true;
    if(drag.moved){ drag.panda.x = ix + drag.dx; drag.panda.y = iy + drag.dy; }
    return;
  }
  if(pathDraw){ pathDraw.push([ix,iy]); return; }
  if(viewDrag){
    par.tx = Math.max(-30, Math.min(30, viewDrag.tx + (e.clientX-viewDrag.cx)/view.s));
    par.ty = Math.max(-20, Math.min(20, viewDrag.ty + (e.clientY-viewDrag.cy)/view.s));
  }
});
cv.addEventListener('pointerup', e=>{
  if(drag.panda){
    const p = drag.panda;
    if(drag.moved){
      const [nx, ny] = nearestWalkable(p.x, p.y);
      p.x = nx; p.y = ny; p.home = {x:nx, y:ny};
      if(p.state==='walk'){ p.state='stand'; p.t=0; p.dur=1.4; }
      selected = p;
    } else {
      selected = (selected===p) ? null : p;
    }
    drag = {panda:null, moved:false, dx:0, dy:0};
    return;
  }
  if(pathDraw){
    const pts = pathDraw; pathDraw = null;
    let len = 0; for(let i=1;i<pts.length;i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if(len > 90 && pts.length > 8){
      let cx=0, cy=0; pts.forEach(pt=>{cx+=pt[0]; cy+=pt[1];}); cx/=pts.length; cy/=pts.length;
      let rad=0; pts.forEach(pt=>{rad+=Math.hypot(pt[0]-cx, pt[1]-cy);}); rad/=pts.length;
      if(rad>=22 && rad<=150){
        if(walkable(cx, cy, Math.min(26, rad*0.4))){
          const h = Math.max(92, Math.min(300, rad*2.05));
          spawnPanda(cx, cy, h);
        } else toast('换块空地画圈吧');
      } else if(rad>150) toast('圈太大啦，画小一点');
      else toast('圈太小啦，再画大一点');
    }
    return;
  }
  viewDrag = null;
});
cv.addEventListener('dblclick', e=>{
  const [ix, iy] = toImg(e.clientX, e.clientY);
  const p = hitPanda(ix, iy);
  if(p){ burst(p.x, p.y-p.h*0.5, 10); pandas.splice(pandas.indexOf(p),1); if(selected===p) selected=null; toast('熊猫回家啦'); }
});
addEventListener('keydown', e=>{
  if((e.key==='Delete' || e.key==='Backspace') && selected){
    burst(selected.x, selected.y-selected.h*0.5, 10);
    pandas.splice(pandas.indexOf(selected),1); selected=null; toast('熊猫回家啦');
  }
  if(e.key==='ArrowLeft') par.tx = Math.max(-30, par.tx-8);
  if(e.key==='ArrowRight') par.tx = Math.min(30, par.tx+8);
  if(e.key==='ArrowUp') par.ty = Math.max(-20, par.ty-6);
  if(e.key==='ArrowDown') par.ty = Math.min(20, par.ty+6);
});
document.getElementById('btnView').addEventListener('click', ()=>{ par.tx=0; par.ty=0; });

/* ================= 启动 ================= */
function start(){
  document.getElementById('loading').style.display = 'none';
  const a = makePanda(822, 924, 208, 'eat');
  const b = makePanda(1150, 800, 175, 'stand');
  const c = makePanda(998, 1013, 258, 'sleep'); c.h = 258; // 睡姿按宽度定尺寸
  const d = makePanda(1290, 819, 178, 'wave');
  [a,b,c,d].forEach(p=>p.pop=1);
  if(new URLSearchParams(location.search).get('demo')){
    const w = makePanda(640, 700, 150, 'walk'); w.tx=900; w.ty=760; w.pop=1;
    spawnPanda(1080, 950, 120); selected = b;
  }
  requestAnimationFrame(frame);
}
