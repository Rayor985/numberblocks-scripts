<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆芽的童书世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF9F0;color:#3a2e1f;min-height:100vh}
.hero{background:linear-gradient(135deg,#FF9A56 0%,#FF6B8B 55%,#B388FF 100%);color:#fff;text-align:center;padding:64px 20px 56px;position:relative;overflow:hidden}
.hero::before{content:"📚 🌟 🎈 🧸 🌈";position:absolute;top:14px;left:0;right:0;font-size:26px;opacity:.55;letter-spacing:18px}
.hero h1{font-size:2.6rem;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.hero p{font-size:1.05rem;opacity:.95;max-width:560px;margin:0 auto;line-height:1.8}
.wrap{max-width:1000px;margin:0 auto;padding:36px 20px 60px}
.sec-title{font-size:1.4rem;margin:8px 4px 20px;color:#5a4632}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(120,80,30,.10);transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
a.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(120,80,30,.16)}
.card .cover{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#FFE0B2,#FFCCBC)}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:20px 20px 22px;flex:1;display:flex;flex-direction:column}
.card .body h2{font-size:1.25rem;margin-bottom:6px}
.card .body .sub{font-size:.85rem;color:#a08c6f;margin-bottom:10px}
.card .body p.desc{font-size:.92rem;line-height:1.7;color:#6b5b45;flex:1}
.card .go{margin-top:14px;font-size:.9rem;font-weight:600;color:#ff7b54}
.card.soon{opacity:.75}
.card.soon .cover{background:linear-gradient(135deg,#E8E0F5,#D9ECFF);font-size:52px}
.card.soon .go{color:#a08c6f}
.badge{display:inline-block;font-size:.72rem;background:#4caf50;color:#fff;border-radius:20px;padding:3px 12px;margin-bottom:10px;width:fit-content}
.badge.soon{background:#b0a48f}
footer{text-align:center;color:#b8a888;font-size:.82rem;padding:28px 20px 40px;line-height:1.8}
@media(max-width:560px){.hero{padding:48px 16px 40px}.hero h1{font-size:2rem}}
</style>
</head>
<body>
<div class="hero">
  <h1>🌱 豆芽的童书世界</h1>
  <p>这里是豆芽的专属故事小天地<br>有数字小伙伴的冒险，也有更多好故事正在路上</p>
</div>
<div class="wrap">
  <div class="sec-title">📖 故事板块</div>
  <div class="blocks" id="blocks"></div>
</div>
<footer>
  为豆芽用心制作 · 原创内容<br>
  豆芽的童书世界 © 2026
</footer>
<script>
/* ============================================================
   添加新板块的方法：
   在 BLOCKS 数组里加一项，照着第一块的格式填：
     title    板块中文名
     sub      英文/副标题
     desc     一句话介绍
     href     板块入口页面（如 "donghua.html"），soon 状态可留空
     emoji    封面表情图标（有封面图时可不填）
     cover    封面图片地址（可选，不填则用 emoji）
     status   "open" 已上线 / "soon" 即将到来
   ============================================================ */
const BLOCKS = [
  {
    title: "Numberblocks",
    sub: "数字积木 · 中英双语剧本",
    desc: "1–9 季 185 集完整剧本，每集都有中英对照台词，还有好听的数字儿歌。",
    href: "numberblocks.html",
    emoji: "🔢",
    cover: "assets/img/s01e01-hero.jpg",
    status: "open"
  },
  {
    title: "Look What I Found",
    sub: "看我找到了什么 · 英国自然探索绘本",
    desc: "全套 5 册完整收录！跟随大自然的小小寻宝家探索森林、海边、农场、河畔与公园。含官方原声伴读与中英逐句对照。",
    href: "look-what-i-found.html",
    emoji: "🌿",
    cover: "",
    status: "open"
  },
  {
    title: "第三块 · 即将到来",
    sub: "Coming soon",
    desc: "新的故事正在准备中，敬请期待。",
    href: "",
    emoji: "🎈",
    cover: "",
    status: "soon"
  },
  {
    title: "第四块 · 即将到来",
    sub: "Coming soon",
    desc: "新的故事正在准备中，敬请期待。",
    href: "",
    emoji: "🌈",
    cover: "",
    status: "soon"
  }
];

const box = document.getElementById("blocks");
BLOCKS.forEach(b => {
  const isOpen = b.status === "open";
  const el = document.createElement(isOpen ? "a" : "div");
  el.className = "card" + (isOpen ? "" : " soon");
  if (isOpen) el.href = b.href;
  const coverHtml = b.cover
    ? `<img src="${b.cover}" alt="${b.title}" loading="lazy">`
    : b.emoji;
  el.innerHTML = `
    <div class="cover">${coverHtml}</div>
    <div class="body">
      <span class="badge${isOpen ? "" : " soon"}">${isOpen ? "已上线" : "即将到来"}</span>
      <h2>${b.title}</h2>
      <div class="sub">${b.sub}</div>
      <p class="desc">${b.desc}</p>
      <div class="go">${isOpen ? "进入 →" : "敬请期待"}</div>
    </div>`;
  box.appendChild(el);
});
</script>
</body>
</html>
